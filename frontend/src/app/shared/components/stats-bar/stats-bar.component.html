<section class="stats-container grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
  
  <!-- Stat 1: Restaurants -->
  <div class="glass-card p-4 flex items-center space-x-3 border-l-4 border-amber-500">
    <div class="p-2.5 rounded-lg bg-amber-500/10 text-amber-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
    </div>
    <div>
      <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Active Stores</p>
      <div class="flex items-baseline space-x-2">
        <h4 class="text-xl font-bold text-white">{{ restaurantCount }}</h4>
        <span class="text-[10px] text-emerald-400 font-medium">PostgreSQL+Redis</span>
      </div>
    </div>
  </div>

  <!-- Stat 2: Menu Items -->
  <div class="glass-card p-4 flex items-center space-x-3 border-l-4 border-brand-500">
    <div class="p-2.5 rounded-lg bg-brand-500/10 text-brand-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
    </div>
    <div>
      <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Menu Dishes</p>
      <div class="flex items-baseline space-x-2">
        <h4 class="text-xl font-bold text-white">{{ menuItemCount }}</h4>
        <span class="text-[10px] text-slate-400">10 / restaurant</span>
      </div>
    </div>
  </div>

  <!-- Stat 3: Delivery Fleet -->
  <div class="glass-card p-4 flex items-center space-x-3 border-l-4 border-blue-500">
    <div class="p-2.5 rounded-lg bg-blue-500/10 text-blue-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    </div>
    <div>
      <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Delivery Fleet</p>
      <div class="flex items-baseline space-x-2">
        <h4 class="text-xl font-bold text-white">{{ activeAgentCount }}</h4>
        <span class="text-[10px] text-blue-400 font-medium">EV / Scooters</span>
      </div>
    </div>
  </div>

  <!-- Stat 4: Kafka Event Stream -->
  <div class="glass-card p-4 flex items-center space-x-3 border-l-4 border-purple-500">
    <div class="p-2.5 rounded-lg bg-purple-500/10 text-purple-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
    </div>
    <div>
      <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Kafka Event Mesh</p>
      <div class="flex items-baseline space-x-2">
        <h4 class="text-xl font-bold text-white">5 Topics</h4>
        <span class="text-[10px] text-purple-400 font-medium">KRaft Mode</span>
      </div>
    </div>
  </div>

</section>
