<header class="navbar-wrapper border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand Logo -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center shadow-lg shadow-brand-500/30">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-tight text-white">Bite<span class="text-brand-500">Stream</span></span>
            <span class="px-2 py-0.5 text-[10px] font-semibold bg-brand-500/20 text-brand-400 border border-brand-500/30 rounded-full">v1.0.0</span>
          </div>
          <p class="text-xs text-slate-400 hidden sm:block">Event-Driven Food Delivery & Dispatch Platform</p>
        </div>
      </div>

      <!-- Live Stack Links & Status Badge -->
      <div class="flex items-center space-x-3 sm:space-x-4">
        <!-- Backend Health Pill -->
        <div class="flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-medium border"
             [ngClass]="{
               'bg-emerald-500/10 text-emerald-400 border-emerald-500/30': backendStatus() === 'UP',
               'bg-rose-500/10 text-rose-400 border-rose-500/30': backendStatus() === 'OFFLINE',
               'bg-amber-500/10 text-amber-400 border-amber-500/30': backendStatus() === 'CHECKING'
             }">
          <span class="w-2 h-2 rounded-full"
                [ngClass]="{
                  'bg-emerald-400 animate-pulse': backendStatus() === 'UP',
                  'bg-rose-400': backendStatus() === 'OFFLINE',
                  'bg-amber-400 animate-ping': backendStatus() === 'CHECKING'
                }"></span>
          <span>API: {{ backendStatus() }}</span>
        </div>

        <!-- Quick Access Documentation Links -->
        <div class="hidden md:flex items-center space-x-2">
          <a href="http://localhost:8080/swagger-ui/index.html" target="_blank"
             class="px-2.5 py-1 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition flex items-center space-x-1">
            <span>Swagger UI</span>
            <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </a>
          <a href="http://localhost:3000" target="_blank"
             class="px-2.5 py-1 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition flex items-center space-x-1">
            <span>Grafana</span>
            <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </a>
          <a href="http://localhost:9090" target="_blank"
             class="px-2.5 py-1 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition flex items-center space-x-1">
            <span>Prometheus</span>
            <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
