name: CD - Continuous Deployment

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  determine-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.resolve.outputs.target_env }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Compute Environment & Tags
        id: resolve
        run: |
          REF_NAME="${{ github.ref_name }}"
          INPUT_ENV="${{ github.event.inputs.target_env }}"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_ENV" ] && [ "$INPUT_ENV" != "auto" ]; then
            TARGET_ENV="$INPUT_ENV"
          elif [ "$REF_NAME" = "main" ]; then
            TARGET_ENV="production"
          else
            TARGET_ENV="staging"
          fi
          
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "image_tag=$REF_NAME" >> $GITHUB_OUTPUT
          echo "Branch: $REF_NAME -> Target Environment: $TARGET_ENV"

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: determine-environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.determine-environment.outputs.image_tag }}
            type=raw,value=${{ needs.determine-environment.outputs.image_tag }}-${{ github.sha }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ needs.determine-environment.outputs.target_env == 'production' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-push]
    environment:
      name: ${{ needs.determine-environment.outputs.target_env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Deployment Metadata
        run: |
          echo "=========================================================="
          echo "Deploying BiteStream Platform"
          echo "Target Environment : ${{ needs.determine-environment.outputs.target_env }}"
          echo "Source Branch      : ${{ github.ref_name }}"
          echo "Commit SHA         : ${{ github.sha }}"
          echo "Image Tag          : ${{ needs.determine-environment.outputs.image_tag }}-${{ github.sha }}"
          echo "Registry Image     : ghcr.io/${{ github.repository }}"
          echo "=========================================================="

      - name: Execute Deployment Rollout
        run: |
          ENV="${{ needs.determine-environment.outputs.target_env }}"
          IMAGE="ghcr.io/${{ github.repository }}:${{ needs.determine-environment.outputs.image_tag }}-${{ github.sha }}"
          echo "Applying deployment manifests for environment: $ENV"
          echo "Target Container Image: $IMAGE"
          
          # Production & Staging rollout commands (Kubernetes / Helm / Docker Swarm / Cloud Provider)
          # Example Kubernetes deployment update:
          # kubectl set image deployment/bitestream-app bitestream=$IMAGE -n bitestream-$ENV
          # kubectl rollout status deployment/bitestream-app -n bitestream-$ENV --timeout=180s
          
          echo "Deployment rollout completed successfully for environment: $ENV"
