services:
  # ============================================================================
  # Apache Kafka (KRaft mode - no Zookeeper needed)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: bitestream-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitestream-net

  # ============================================================================
  # PostgreSQL Database (Version 16 with native JSONB support)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bitestream-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bitestream-net

  # ============================================================================
  # Redis Cache (Optimized for fast OTP TTL, lock and geospatial caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: bitestream-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bitestream-net

  # ============================================================================
  # BiteStream Spring Boot Application Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitestream-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bitestream-net
    volumes:
      - app_logs:/var/log/bitestream
    profiles:
      - app-container
      - frontend

  # ============================================================================
  # Observability & Logging Stack (Profile: logging)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bitestream-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./logging/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - bitestream-net
    profiles:
      - logging

  loki:
    image: grafana/loki:3.1.1
    container_name: bitestream-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - bitestream-net
    profiles:
      - logging

  promtail:
    image: grafana/promtail:3.1.1
    container_name: bitestream-promtail
    restart: unless-stopped
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - app_logs:/var/log/bitestream:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - bitestream-net
    profiles:
      - logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bitestream-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./logging/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./logging/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./logging/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - bitestream-net
    profiles:
      - logging

  # ============================================================================
  # Observability & Logging Stack (Profile: logging)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bitestream-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./logging/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - bitestream-net
    profiles:
      - logging

  loki:
    image: grafana/loki:3.1.1
    container_name: bitestream-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - bitestream-net
    profiles:
      - logging

  promtail:
    image: grafana/promtail:3.1.1
    container_name: bitestream-promtail
    restart: unless-stopped
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - app_logs:/var/log/bitestream:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - bitestream-net
    profiles:
      - logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bitestream-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./logging/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./logging/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./logging/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - bitestream-net
    profiles:
      - logging

volumes:
  kafka_data:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
  app_logs:
    name: bitestream_app_logs

networks:
  bitestream-net:
    driver: bridge
