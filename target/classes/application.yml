server:
  port: 8080

spring:
  application:
    name: bitestream

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes cache TTL for static menu data
      cache-null-values: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: food-delivery-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true

# BiteStream Platform Configuration
food-delivery:
  topics:
    order-placed: food.orders.placed
    restaurant-notification: food.restaurant.notifications
    delivery-assigned: food.delivery.assigned
    delivery-pickup: food.delivery.pickup
    delivery-completed: food.delivery.completed
  logistics:
    speed-km-per-hour: 20.0
    buffer-pickup-minutes: 4
    queue-penalty-per-order-minutes: 3
    pickup-otp-ttl-minutes: 15
    delivery-otp-ttl-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
